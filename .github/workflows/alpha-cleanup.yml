# A deleted feature branch takes its rolling alpha pre-release with it (docs/releases.md).
name: alpha-cleanup

on:
  delete:

permissions:
  contents: write

jobs:
  forget:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.ref }}
        run: |
          tag="alpha-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9-' '-')"
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "$BRANCH had no alpha release"
