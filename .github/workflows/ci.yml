name: ci

on:
  pull_request:
  push:
    # A feature branch's pushes are verified, then published as its alpha (`publish`).
    # A stable line's (stable/X.Y) and the next version's (next/X.Y) are published as their
    # pre-releases, -rc.N and -next.N.
    branches: [main, dev, "stable/*", "next/*", "feat/**", "fix/**"]
  workflow_dispatch:

# A push makes the runs of the same ref's older pushes useless: they are cancelled, so that the
# queue holds only what is current. Not on dev, main, a stable or next line or a stable line's
# release tag, whose runs publish and always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/stable/') && !startsWith(github.ref, 'refs/heads/next/') && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  commit-messages:
    # A feature branch's commits are judged on its pull request, as before its pushes ran here.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/stable/') || startsWith(github.ref, 'refs/heads/next/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      # Not on `main`, nor on a pull request into it: it brings commits already judged as pull
      # requests, squashed by GitHub with ` (#n)` added to the subject. Not on a run started by
      # hand or by a workflow, which has no `before`: what it builds was judged on its push.
      - name: Check the Angular commit convention
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # A release moves main to a commit of dev (docs/releases.md): when that commit's push run on dev
  # succeeded, its `verify` passed there and main does not run it again. Anything else (no such
  # run, a failed one, an error of the API) says nothing, and main runs `verify` itself. A line's
  # release, built on its tag `vX.Y.Z`, asks the same of the push run on its line `stable/X.Y`.
  verified-on-dev:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.dev.outputs.verified }}
    steps:
      - name: Did this commit's push run on dev succeed
        id: dev
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag of another form says nothing: verify runs.
            if ! [[ $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::notice::$GITHUB_REF_NAME is not a line's release: verify runs here."
              exit 0
            fi
            branch=stable/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}
          fi
          if n=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=$branch&status=success" --jq .total_count) && [ "$n" -gt 0 ]; then
            echo "::notice::$GITHUB_SHA passed on $branch: verify is not run again."
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No successful push run of $GITHUB_SHA on $branch: verify runs here."
          fi

  # Whether the Rust suite has anything to say about this change: a pull request that touches
  # `apps/android/` and `site/` only (docs/remote.md, "The repository") leaves it out. Anything
  # else runs it, and so does every push and every manual run: a push publishes, and main is
  # released from a commit that ran it. A failure here says nothing (`rust` stays empty): the
  # suite then runs, as if it had said so.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      hub: ${{ steps.hub.outputs.hub }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the Rust suite have to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "::notice::$EVENT_NAME: the Rust suite runs."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Not read as a stream: a failure of git must fail this step, not say "nothing changed".
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          rust=false
          while IFS= read -r path; do
            case "$path" in
              apps/android/* | site/*) ;;
              *)
                echo "::notice::${path:-no file}: the Rust suite runs."
                rust=true
                break
                ;;
            esac
          done <<< "$files"
          # A change of no file at all is not one to skip the suite for.
          if [ -z "$files" ]; then rust=true; fi
          if [ "$rust" = false ]; then echo "::notice::Only apps/android/ and site/ changed: the Rust suite does not run."; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      # The hub's jobs (`hub`) are not in every pull request's CI: only in one that changes the hub,
      # what it is built from, or the files that build and publish it. A push always runs them: a
      # push publishes. A failure here says nothing (`hub` stays empty): they then run.
      - name: Does the hub have to be built and checked
        id: hub
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "::notice::$EVENT_NAME: the hub is built."
            echo "hub=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          hub=false
          while IFS= read -r path; do
            case "$path" in
              crates/flottille-hub/* | crates/flottille-link/* | crates/flottille-protocol/* | \
                Cargo.toml | Cargo.lock | LICENSE | \
                .github/workflows/ci.yml | .github/workflows/release.yml | \
                tools/package-hub.sh | tools/check-static.sh | tools/check-hub-image.sh)
                echo "::notice::$path: the hub is built."
                hub=true
                break
                ;;
            esac
          done <<< "$files"
          if [ -z "$files" ]; then hub=true; fi
          if [ "$hub" = false ]; then echo "::notice::Nothing of the hub or its release changed: it is not built."; fi
          echo "hub=$hub" >> "$GITHUB_OUTPUT"

  # No real agent, no real configuration: the suites run against a fake ACP agent and throwaway
  # repositories (see AGENTS.md, Testing).
  #
  # The suite is split so that a pull request does not wait for every test binary one after the
  # other on one runner: the matrix `test` builds the tests on six runners at once and each runs
  # a sixth of them (`cargo nextest run --partition count:k/6`), `check` runs the formatting and
  # clippy beside them, and `verify`, the required check, reports what they all said. Each
  # partition builds the tests itself, from the cache: about four minutes, when an archive built
  # once (6 GB, 37 GB extracted) took longer to pack, upload, download and extract.
  check:
    needs: [verified-on-dev, changes]
    # `verified-on-dev` is skipped off main: `!cancelled()` keeps that from skipping this job.
    # Left out only when `changes` said so, not when it said nothing.
    if: ${{ !cancelled() && needs.verified-on-dev.outputs.verified != 'true' && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    env:
      # An incremental cache is only written here, never reused by the next run.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The key does not follow Cargo.toml: bump this one when a profile changes, or the
          # cache keeps the artefacts of the old profiles and never saves the new ones.
          prefix-key: v2-rust
          # Clippy's own artefacts, apart from the tests' (`test`).
          shared-key: check
      # The window links against fontconfig and freetype; GPUI loads Wayland and Vulkan at run
      # time and opens no window here: its tests use GPUI's own test platform.
      - name: Have the window's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The margin left on the runner, read even when a step above failed.
      - name: Disk left
        if: always()
        run: df -h /
        # A failure to print it must not hide the verdict above.
        continue-on-error: true

  test:
    needs: [verified-on-dev, changes]
    if: ${{ !cancelled() && needs.verified-on-dev.outputs.verified != 'true' && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # Every partition says what fails in it, not only the first one to fail.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          # The name of the job that wrote the cache before the suite was split: the
          # dependencies already cached are kept. The partitions build the same thing: one saves.
          shared-key: verify
          save-if: ${{ matrix.partition == 1 }}
      - name: Have the window's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --locked --partition count:${{ matrix.partition }}/6 --no-fail-fast
      # nextest does not run doc tests: one partition runs them, whatever its tests said.
      - if: ${{ !cancelled() && matrix.partition == 1 }}
        run: cargo test --doc --locked
      - name: Disk left
        if: always()
        run: df -h /
        continue-on-error: true

  # The required check: one job that always ends, success or failure, whatever happened to the
  # partitions (failed, cancelled, never started), so that it never waits on a job skipped.
  # `check` and `test` skipped are a pass only when `changes` said the suite is not needed.
  verify:
    needs: [verified-on-dev, changes, check, test, hub]
    # Skipped only when this commit passed it on dev (on main, see `verified-on-dev`).
    if: ${{ always() && needs.verified-on-dev.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Did the checks and every partition pass
        id: verdict
        env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
          RUST: ${{ needs.changes.outputs.rust }}
          HUB: ${{ needs.hub.result }}
        run: |
          # `publish` needs `hub`: a red hub check merged would stop every release. Skipped (a pull
          # request that leaves the hub alone) is fine.
          if [ "$HUB" = failure ] || [ "$HUB" = cancelled ]; then
            echo "::error::hub: $HUB."
            exit 1
          fi
          if [ "$CHECK" = success ] && [ "$TEST" = success ]; then exit 0; fi
          if [ "$RUST" = false ] && [ "$CHECK" = skipped ] && [ "$TEST" = skipped ]; then
            echo "::notice::The Rust suite was not needed for this change."
            exit 0
          fi
          echo "::error::check: $CHECK, test: $TEST, rust suite needed: ${RUST:-unknown}."
          exit 1

  # The packages (docs/releases.md): main is stable, dev beta, a feature branch its own alpha.
  # `build` runs the branch's code with a token that can only read; `publish`, once `verify`
  # passed on the pushed commit, runs none of it and alone may write the releases and the tags.
  # main is built when the `Release` workflow (release.yml) starts this one on it: the ref it moved
  # with its own token started no push run. So is a stable line's release, on the tag it made, and
  # next/X.Y once forward.yml merged dev into it.
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/next/')))
    # Old enough a C library that the binary runs on current Arch and Debian stable.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The channel and the version
        id: version
        run: |
          skip() { echo "::notice::$1: nothing is published."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          at=$GITHUB_SHA
          # A line's release (release.yml): the tag vX.Y.Z it put on a commit of stable/X.Y, with
          # the version of that commit's release candidate (-rc). Its changelog is the line's
          # commits since the line's previous tag.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ $GITHUB_REF_NAME =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*))\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a stable version: nothing was published."
              exit 1
            fi
            line=stable/${BASH_REMATCH[1]}
            version=${GITHUB_REF_NAME#v}
            if ! git merge-base --is-ancestor "$at" "origin/$line"; then
              echo "::error::$at is not a commit of $line: a line's release is made by the Release workflow only (docs/releases.md), nothing was published."
              exit 1
            fi
            if ! git tag --points-at "$at" | grep -qE "^v${version//./\\.}-rc\.[0-9]+$"; then
              echo "::error::$at has no release candidate of $version: nothing was published."
              exit 1
            fi
            read -r _ since <<< "$(tools/version.sh base --branch "$line" --at "$at^")"
            tools/changelog.sh "$since..$at" > "$RUNNER_TEMP/changelog.md"
            {
              echo "channel=stable"
              echo "version=$version"
              echo "tag=$GITHUB_REF_NAME"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            main)
              channel=stable
              # A release is main moved forward to a commit of dev, which is the commit released:
              # its version is the one its beta had, without the pre-release.
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
                echo "::error::$GITHUB_SHA is not a commit of dev: main is released by the Release workflow only (docs/releases.md), nothing was published."
                exit 1
              fi
              ;;
            dev) channel=beta ;;
            # A line says its own channel, so that its binary follows the line (docs/releases.md);
            # its version is computed as a pre-release, the "beta" of version.sh.
            stable/*) channel=rc ;;
            next/*) channel=next ;;
            *) channel=alpha ;;
          esac
          computed=$channel
          case "$channel" in rc | next) computed=beta ;; esac
          status=0
          version=$(tools/version.sh "$computed" --branch "$GITHUB_REF_NAME" --at "$at") || status=$?
          # 3: nothing was committed since the last release, which is then this one, run again.
          [ "$status" -ne 3 ] || skip "nothing to release since the last stable release"
          [ "$status" -eq 0 ] || exit "$status"
          # Every build is its own release, an alpha's too: nothing is ever replaced.
          tag="v$version"
          tools/changelog.sh --at "$at" --branch "$GITHUB_REF_NAME" > "$RUNNER_TEMP/changelog.md"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Have the window's system libraries
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          FLOTTILLE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          FLOTTILLE_BUILD_CHANNEL: ${{ steps.version.outputs.channel }}
          FLOTTILLE_BUILD_BRANCH: ${{ github.ref_name }}
        run: cargo build --release --locked -p flottille
      - name: Package, with the notes
        if: steps.version.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          tools/package.sh "$VERSION" target/release/flottille "$out/assets"
          # The install.sh of this very commit: main has none before the first stable release.
          install="curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh | sh -s -- --channel $CHANNEL"
          if [ "$CHANNEL" = alpha ]; then install="$install --branch '$GITHUB_REF_NAME'"; fi
          # A stable line's builds, and the next version's, are not dev's: this very version.
          if [ "$GITHUB_REF_TYPE" = tag ] || [[ $GITHUB_REF_NAME == stable/* || $GITHUB_REF_NAME == next/* ]]; then
            install="curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh | sh -s -- --version $VERSION"
          fi
          {
            echo "Flottille $VERSION, $CHANNEL, built from ${GITHUB_SHA:0:12}."
            echo
            echo "Linux x86_64. Install: \`$install\` (see docs/releases.md)."
            echo "The window needs the system's fontconfig, freetype, xkbcommon (and xkbcommon-x11), wayland-client or libxcb, and a Vulkan loader with a driver."
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$out/notes.md"
      - if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 1

  # The hub (docs/releases.md, "What CI publishes"): its static binary for both architectures,
  # the archives and the image, and the three scenarios of its release as steps. On a pull request
  # that changes the hub or its release (`changes`), and on every push that publishes, where it
  # holds the files `publish` puts beside Flottille's archives. Like `build`, it runs the branch's
  # code with a token that can only read, and it publishes nothing.
  hub:
    needs: [changes, build]
    # `build` is skipped on a pull request: `!cancelled()` keeps that from skipping this job. On a
    # push, it follows `build` (the version), and is skipped when `build` publishes nothing.
    if: >-
      !cancelled()
      && needs.changes.outputs.hub != 'false'
      && (github.event_name == 'pull_request'
        || (needs.build.result == 'success' && needs.build.outputs.skip != 'true'))
    # The runner Flottille's own build uses.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            platform: amd64
          # Cross-compiled by the C compiler of the other architecture: nothing is emulated.
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            platform: arm64
    env:
      CARGO_INCREMENTAL: 0
      # `ring`, under the hub's TLS, has C and assembly to build for the target. No linker is set for
      # x86_64: `musl-gcc` is a wrapper that links dynamically, whatever Rust asks, and the target's
      # own linking is static.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      # A pull request's archives carry no real version: they are only made, to be checked.
      VERSION: ${{ needs.build.outputs.version || '0.0.0-ci' }}
      BINARY: target/${{ matrix.target }}/release/flottille-hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Have the musl and the cross compilers, and the target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: hub-${{ matrix.target }}
      - name: Build the hub
        run: cargo build --release --locked -p flottille-hub --target ${{ matrix.target }}
      - name: the_static_binary_runs_with_no_shared_library
        run: tools/check-static.sh "$BINARY"
      # The architecture of the runner: the binary that is static runs. The other one is not run.
      - name: Run the hub it built
        if: matrix.arch == 'x86_64'
        run: |
          "$BINARY" --version
          "$BINARY" --help > /dev/null
      - name: Package, with its sum
        run: tools/package-hub.sh "$VERSION" ${{ matrix.arch }} "$BINARY" "$RUNNER_TEMP/hub/assets"
      # `scratch` and a COPY: the image of the other architecture is made here too, with nothing run.
      - name: Build the image
        run: |
          context="$RUNNER_TEMP/hub-image"
          mkdir -p "$context/lib/flottille-hub"
          install -m 0755 "$BINARY" "$context/flottille-hub"
          docker build --platform linux/${{ matrix.platform }} --build-arg SOURCE=https://github.com/${{ github.repository }} -f crates/flottille-hub/Dockerfile -t flottille-hub:linux-${{ matrix.platform }} "$context"
      - name: the_image_starts_prints_a_setup_code_and_answers_on_its_port
        if: matrix.arch == 'x86_64'
        run: tools/check-hub-image.sh flottille-hub:linux-amd64
      - name: the_compose_example_is_valid
        if: matrix.arch == 'x86_64'
        env:
          FLOTTILLE_HUB_IMAGE: flottille-hub:linux-amd64
        run: docker compose -f crates/flottille-hub/compose.example.yml config
      - name: Keep the image for the job that pushes it
        if: github.event_name != 'pull_request'
        run: docker save flottille-hub:linux-${{ matrix.platform }} --output "$RUNNER_TEMP/hub-image-${{ matrix.platform }}.tar"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hub-assets-${{ matrix.arch }}
          path: ${{ runner.temp }}/hub
          retention-days: 1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hub-image-${{ matrix.platform }}
          path: ${{ runner.temp }}/hub-image-${{ matrix.platform }}.tar
          retention-days: 1

  publish:
    needs: [verified-on-dev, verify, build, hub]
    # `verify` passed here, or was skipped because this commit passed it on dev: never on a commit
    # no `verify` passed on. A failed or skipped `build` publishes nothing.
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.build.result == 'success' && needs.build.outputs.skip != 'true'
      && needs.hub.result == 'success'
      && (needs.verify.result == 'success'
        || (needs.verify.result == 'skipped' && needs.verified-on-dev.outputs.verified == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with alpha-cleanup.yml: a branch's alpha is never deleted while it is published.
    concurrency:
      group: publish-${{ github.ref_name }}
    # This job holds the write token: it runs no git and never works inside the artifact, whose
    # files come from the branch's code (a repository's layout there would hand its config to
    # git). Only `gh` runs, naming the files it uploads.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # The hub's archives and their sums: in the one `gh release create` below, beside Flottille's.
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-assets-*
          path: hub
          merge-multiple: true
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Read right before publishing: a push over this commit publishes itself, after it, and
          # a deleted branch publishes nothing. A line's release tag must still name this commit.
          path="git/ref/heads/$GITHUB_REF_NAME" jq=.object.sha
          if [ "$GITHUB_REF_TYPE" = tag ]; then path="commits/$GITHUB_REF_NAME" jq=.sha; fi
          if tip=$(gh api "repos/$GH_REPO/$path" --jq "$jq" 2> "$RUNNER_TEMP/tip.err"); then
            if [ "$tip" != "$GITHUB_SHA" ]; then echo "::notice::$GITHUB_REF_NAME moved on to $tip: nothing is published."; exit 0; fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/tip.err"; then
            echo "::notice::$GITHUB_REF_NAME was deleted: nothing is published."; exit 0
          else
            cat "$RUNNER_TEMP/tip.err" >&2; exit 1
          fi
          title="Flottille v$VERSION"
          # Nothing is replaced, ever (releases are immutable): a version already published, of any
          # channel, stays as it is; a draft left by a failed upload is made again.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = true ]; then gh release delete "$TAG" --yes; else echo "::notice::$TAG is already published."; exit 0; fi
          fi
          # The files go with the release in this one call: an immutable release takes none after.
          if [ "$CHANNEL" = stable ] && [ "$GITHUB_REF_NAME" = main ]; then
            # On the commit released, the same on main and on dev: the next betas count from it.
            gh release create "$TAG" release/assets/* hub/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --latest
          elif [ "$CHANNEL" = stable ]; then
            # A line's, on its tag: the stable channel takes the latest release, so it is marked
            # latest when above the one marked (the newest line's fix reaches its users), never
            # when below (an older line's would take the channel back). Not knowing, nothing.
            latest=--latest
            if current=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.err"); then
              if [ "$(printf '%s\n%s\n' "${current#v}" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ] || [ "${current#v}" = "$VERSION" ]; then
                latest=--latest=false
              fi
            elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
              cat "$RUNNER_TEMP/latest.err" >&2; exit 1
            fi
            gh release create "$TAG" release/assets/* hub/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md "$latest"
          else
            gh release create "$TAG" release/assets/* hub/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --prerelease --latest=false
          fi

  # The hub's image (docs/releases.md): once its release is published, the image the `hub` job made
  # is pushed to the repository's container registry under the release's version, and `latest` when
  # that release is the latest. It loads what `hub` saved and pushes it: no Dockerfile, no build and
  # no code of the branch runs here, where the token that writes packages is. No alpha has one: they
  # would pile up, one per push.
  hub-image:
    needs: [build, hub, publish]
    if: >-
      !cancelled()
      && needs.publish.result == 'success' && needs.hub.result == 'success'
      && needs.build.outputs.channel != 'alpha'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-image-*
          path: images
          merge-multiple: true
      - name: Push the image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Only a release that stands has its image: a branch that moved on publishes nothing.
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null) || [ "$draft" = true ]; then
            echo "::notice::$TAG is not published: no image."
            exit 0
          fi
          # The registry wants a lowercase path: the repository's own, `-hub` after it.
          image=ghcr.io/${GITHUB_REPOSITORY,,}-hub
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Nothing is replaced: a version already pushed stays as it is.
          if docker buildx imagetools inspect "$image:$VERSION" > /dev/null 2>&1; then
            echo "::notice::$image:$VERSION is already pushed."
            exit 0
          fi
          for platform in amd64 arm64; do
            docker load --input "images/hub-image-$platform.tar"
            docker tag "flottille-hub:linux-$platform" "$image:$VERSION-$platform"
            docker push "$image:$VERSION-$platform"
          done
          tags=(--tag "$image:$VERSION")
          if [ "$(gh release view "$TAG" --json isLatest --jq .isLatest)" = true ]; then
            tags+=(--tag "$image:latest")
          fi
          # One name for both architectures: the registry's manifest, joined from the two pushed.
          docker buildx imagetools create "${tags[@]}" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
