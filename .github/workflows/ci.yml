name: ci

on:
  pull_request:
  push:
    # A feature branch's pushes are verified, then published as its alpha (`publish`).
    branches: [main, dev, "feat/**", "fix/**"]
  workflow_dispatch:

jobs:
  commit-messages:
    # A feature branch's commits are judged on its pull request, as before its pushes ran here.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      # Not on `main`, nor on a pull request into it: it brings commits already judged as pull
      # requests, squashed by GitHub with ` (#n)` added to the subject.
      - name: Check the Angular commit convention
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # No real agent, no real configuration: the suites run against a fake ACP agent and throwaway
  # repositories (see AGENTS.md, Testing). Skipped until the Cargo workspace exists.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there a Cargo workspace yet
        id: cargo
        run: if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cargo.outputs.present == 'true'
        run: rustup component add rustfmt clippy
      - if: steps.cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      # The window links against fontconfig and freetype; GPUI loads Wayland and Vulkan at run
      # time and opens no window here: its tests use GPUI's own test platform.
      - name: Have the window's system libraries
        if: steps.cargo.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --check
      - if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: steps.cargo.outputs.present == 'true'
        run: cargo test --locked

  # The packages (docs/releases.md): main is stable, dev beta, a feature branch its own alpha,
  # once `verify` passed on the pushed commit. The version is computed, never typed, and the tag
  # is CI's own.
  publish:
    needs: verify
    if: github.event_name == 'push'
    # Old enough a C library that the binary runs on current Arch and Debian stable.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The channel and the version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            main) channel=stable ;;
            dev) channel=beta ;;
            *) channel=alpha ;;
          esac
          status=0
          version=$(tools/version.sh "$channel" --branch "$GITHUB_REF_NAME") || status=$?
          # 3: no commit since the last stable tag bumps the version, nothing to release.
          if [ "$status" -eq 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Have the window's system libraries
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          FLOTTILLE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          FLOTTILLE_BUILD_CHANNEL: ${{ steps.version.outputs.channel }}
          FLOTTILLE_BUILD_BRANCH: ${{ github.ref_name }}
        run: cargo build --release --locked -p flottille
      - name: Package
        if: steps.version.outputs.skip != 'true'
        run: tools/package.sh "${{ steps.version.outputs.version }}" target/release/flottille dist
      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "Flottille ${{ steps.version.outputs.version }}, ${{ steps.version.outputs.channel }}, built from ${GITHUB_SHA:0:12}."
            echo
            echo "Linux x86_64. Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh\` (see docs/releases.md)."
            echo "The window needs the system's fontconfig, freetype, xkbcommon (and xkbcommon-x11), wayland-client or libxcb, and a Vulkan loader with a driver."
            echo
            tools/changelog.sh
          } > notes.md
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$CHANNEL" in
            stable) gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Flottille $VERSION" --notes-file notes.md --latest ;;
            beta) gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Flottille $VERSION" --notes-file notes.md --prerelease --latest=false ;;
            alpha)
              # One rolling pre-release per branch, replaced at each push.
              tag="alpha-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9-' '-')"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Flottille $VERSION" --notes-file notes.md --prerelease --latest=false
              ;;
          esac
