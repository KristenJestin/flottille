name: ci

on:
  pull_request:
  push:
    # A feature branch's pushes are verified, then published as its alpha (`publish`).
    branches: [main, dev, "feat/**", "fix/**"]
  workflow_dispatch:

jobs:
  commit-messages:
    # A feature branch's commits are judged on its pull request, as before its pushes ran here.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      # Not on `main`, nor on a pull request into it: it brings commits already judged as pull
      # requests, squashed by GitHub with ` (#n)` added to the subject.
      - name: Check the Angular commit convention
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # No real agent, no real configuration: the suites run against a fake ACP agent and throwaway
  # repositories (see AGENTS.md, Testing). Skipped until the Cargo workspace exists.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there a Cargo workspace yet
        id: cargo
        run: if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cargo.outputs.present == 'true'
        run: rustup component add rustfmt clippy
      - if: steps.cargo.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      # The window links against fontconfig and freetype; GPUI loads Wayland and Vulkan at run
      # time and opens no window here: its tests use GPUI's own test platform.
      - name: Have the window's system libraries
        if: steps.cargo.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - if: steps.cargo.outputs.present == 'true'
        run: cargo fmt --check
      - if: steps.cargo.outputs.present == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: steps.cargo.outputs.present == 'true'
        run: cargo test --locked

  # The packages (docs/releases.md): main is stable, dev beta, a feature branch its own alpha.
  # `build` runs the branch's code with a token that can only read; `publish`, once `verify`
  # passed on the pushed commit, runs none of it and alone may write the releases and the tags.
  build:
    if: github.event_name == 'push'
    # Old enough a C library that the binary runs on current Arch and Debian stable.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # To find the pull request a push to main squashed.
      pull-requests: read
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The channel and the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "::notice::$1: nothing is published."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          at=$GITHUB_SHA
          case "$GITHUB_REF_NAME" in
            main)
              channel=stable
              # A release is the pull request dev → main merged by squash: its version is the one
              # the head of dev it squashed had, without the pre-release.
              at=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\" and .base.ref == \"main\" and .head.ref == \"dev\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0].head.sha // empty")
              # No other push to main is expected: a lookup that found nothing is an error, and a
              # pull request GitHub had not indexed yet is found when the run is run again.
              if [ -z "$at" ]; then
                echo "::error::$GITHUB_SHA is not the squash of a pull request from dev into main, as far as GitHub's API says now. Run this run again (gh run rerun $GITHUB_RUN_ID) to look again; nothing was published."
                exit 1
              fi
              git cat-file -e "$at^{commit}" 2>/dev/null || git fetch --quiet origin "$at"
              ;;
            dev) channel=beta ;;
            *) channel=alpha ;;
          esac
          status=0
          version=$(tools/version.sh "$channel" --branch "$GITHUB_REF_NAME" --at "$at") || status=$?
          # 3: nothing was committed since the last release, which is then this one, run again.
          [ "$status" -ne 3 ] || skip "nothing to release since the last stable release"
          [ "$status" -eq 0 ] || exit "$status"
          case "$channel" in
            # Each byte but ASCII letters, digits and dashes is a dash (docs/releases.md).
            alpha) tag="alpha-$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9-' '-')" ;;
            *) tag="v$version" ;;
          esac
          tools/changelog.sh --at "$at" > "$RUNNER_TEMP/changelog.md"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "tag=$tag"
            if [ "$channel" = stable ]; then echo "released=$at"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Have the window's system libraries
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          FLOTTILLE_BUILD_VERSION: ${{ steps.version.outputs.version }}
          FLOTTILLE_BUILD_CHANNEL: ${{ steps.version.outputs.channel }}
          FLOTTILLE_BUILD_BRANCH: ${{ github.ref_name }}
        run: cargo build --release --locked -p flottille
      - name: Package, with the notes
        if: steps.version.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          tools/package.sh "$VERSION" target/release/flottille "$out/assets"
          # The install.sh of this very commit: main has none before the first stable release.
          install="curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install.sh | sh -s -- --channel $CHANNEL"
          if [ "$CHANNEL" = alpha ]; then install="$install --branch '$GITHUB_REF_NAME'"; fi
          {
            echo "Flottille $VERSION, $CHANNEL, built from ${GITHUB_SHA:0:12}."
            echo
            echo "Linux x86_64. Install: \`$install\` (see docs/releases.md)."
            echo "The window needs the system's fontconfig, freetype, xkbcommon (and xkbcommon-x11), wayland-client or libxcb, and a Vulkan loader with a driver."
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$out/notes.md"
      - if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 1

  publish:
    needs: [verify, build]
    if: github.event_name == 'push' && needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with alpha-cleanup.yml: a branch's alpha is never deleted while it is published.
    concurrency:
      group: publish-${{ github.ref_name }}
    # This job holds the write token: it runs no git and never works inside the artifact, whose
    # files come from the branch's code (a repository's layout there would hand its config to
    # git). Only `gh` runs, naming the files it uploads.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          RELEASED: ${{ needs.build.outputs.released }}
        run: |
          # Read right before publishing: a push over this commit publishes itself, after it, and
          # a deleted branch publishes nothing.
          if tip=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha 2> "$RUNNER_TEMP/tip.err"); then
            if [ "$tip" != "$GITHUB_SHA" ]; then echo "::notice::$GITHUB_REF_NAME moved on to $tip: nothing is published."; exit 0; fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/tip.err"; then
            echo "::notice::$GITHUB_REF_NAME was deleted: nothing is published."; exit 0
          else
            cat "$RUNNER_TEMP/tip.err" >&2; exit 1
          fi
          title="Flottille $VERSION"
          # A release run again: published, it stays (stable, beta) or is replaced in place
          # (alpha); a draft left by a failed upload is made again.
          state=missing
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = true ]; then gh release delete "$TAG" --yes; else state=published; fi
          fi
          case "$CHANNEL" in
            stable | beta)
              if [ "$state" = published ]; then echo "::notice::$TAG is already published."; exit 0; fi
              if [ "$CHANNEL" = stable ]; then
                # The mark the next betas count from: the head of dev this release squashed. The
                # exit status says whether it exists: an error's JSON is not filtered by --jq.
                if marked=$(gh api "repos/$GH_REPO/git/ref/tags/released/$TAG" --jq .object.sha 2> /dev/null); then
                  if [ "$marked" != "$RELEASED" ]; then echo "::error::released/$TAG marks $marked, not $RELEASED."; exit 1; fi
                else
                  gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/released/$TAG" -f sha="$RELEASED" > /dev/null
                fi
                gh release create "$TAG" release/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --latest
              else
                gh release create "$TAG" release/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --prerelease --latest=false
              fi
              ;;
            alpha)
              if [ "$state" = published ]; then
                # Replaced in place, never missing: the tag moves, the new files come (each sum
                # before its archive), then the old ones go.
                gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
                gh release upload "$TAG" release/assets/*.sha256 --clobber
                gh release upload "$TAG" release/assets/*.tar.gz --clobber
                for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
                  [ -e "release/assets/$name" ] || gh release delete-asset "$TAG" "$name" --yes
                done
                gh release edit "$TAG" --title "$title" --notes-file release/notes.md --prerelease --latest=false
              else
                gh release create "$TAG" release/assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --prerelease --latest=false
              fi
              ;;
          esac
