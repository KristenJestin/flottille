# Every commit of dev is merged forward into the version after it, next/X.Y (docs/releases.md,
# "The next version"): a merge commit, never a squash. When it does not merge, a branch
# forward/<dev's commit>-X.Y at dev's commit and a pull request into next/X.Y leave the conflict
# to resolve, and say so; while it is open, the later pushes wait for its merge.
name: forward

on:
  push:
    branches: [dev]

permissions: {}

# One push after another: each merges what the one before left.
concurrency:
  group: forward

jobs:
  forward:
    runs-on: ubuntu-latest
    permissions:
      # To merge into next/X.Y, or to make the forward branch.
      contents: write
      # To open the pull request of a conflict.
      pull-requests: write
      # To start ci.yml on next/X.Y: a ref moved with this token starts no push run, a
      # workflow_dispatch started with it does.
      actions: write
    # This job holds a token that writes the repository: no checkout, no git, no code of any
    # branch. Only `gh`, through GitHub's API.
    steps:
      - name: Merge dev into each next line
        id: forward
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=0
          while read -r _ ref; do
            branch=${ref#refs/heads/}
            [[ $branch =~ ^next/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]] || continue
            line=${BASH_REMATCH[1]}
            # Holds dev's commit already: nothing to merge.
            case "$(gh api "repos/$GH_REPO/compare/$branch...$GITHUB_SHA" --jq .status)" in
              behind | identical)
                echo "::notice::$branch holds $GITHUB_SHA already."
                continue
                ;;
            esac
            # A conflict left to resolve: dev's later commits hold it too, so nothing more is opened
            # until that pull request is merged; the push to dev after it brings them.
            if ! heads=$(gh pr list --base "$branch" --state open --json headRefName --jq '.[].headRefName'); then
              status=1
              continue
            fi
            open=$(grep -m 1 '^forward/' <<< "$heads" || true)
            if [ -n "$open" ]; then
              echo "::notice::A pull request from $open into $branch is open: $GITHUB_SHA waits for its merge."
              continue
            fi
            if gh api "repos/$GH_REPO/merges" -f base="$branch" -f head="$GITHUB_SHA" -f commit_message="chore(repo): merge dev into $branch" > /dev/null 2> "$RUNNER_TEMP/merge.err"; then
              echo "::notice::$GITHUB_SHA merged into $branch."
              gh workflow run ci.yml --ref "$branch"
            elif grep -q 'HTTP 409' "$RUNNER_TEMP/merge.err"; then
              forward=forward/${GITHUB_SHA:0:12}-$line
              # Run again after a failure, the branch may be there already: its pull request is not
              # (none is open, above).
              if ! gh api "repos/$GH_REPO/git/ref/heads/$forward" > /dev/null 2>&1; then
                gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$forward" -f sha="$GITHUB_SHA" > /dev/null
              fi
              gh pr create --base "$branch" --head "$forward" --title "chore(repo): merge dev into $branch" \
                --body "dev's $GITHUB_SHA does not merge into \`$branch\`: the conflict is left to resolve on \`$forward\`, by a merge whose first parent is \`$branch\` (docs/releases.md, \"The next version\"). Merged with a merge commit, never a squash."
              echo "::warning::$GITHUB_SHA does not merge into $branch: a pull request from $forward leaves the conflict to resolve."
            else
              cat "$RUNNER_TEMP/merge.err" >&2
              status=1
            fi
          done < <(gh api "repos/$GH_REPO/git/matching-refs/heads/next/" --paginate --jq '.[] | "\(.object.sha) \(.ref)"')
          exit "$status"
