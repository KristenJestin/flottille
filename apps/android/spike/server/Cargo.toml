# The server side of the Android push spike (#823): never shipped, never in the workspace.
# A hub, a daemon of temporary folders with the fake agent, the gate the phone answers through,
# and the sender of the encrypted Web Push. Built by `../serve.sh` and `../ci.sh`.
[package]
name = "flottille-spike-server"
version = "0.0.0"
edition = "2024"
publish = false

# Apart from the repository's workspace: `cargo build --workspace` never builds it.
[workspace]

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
flottille-client = { path = "../../../../crates/flottille-client" }
flottille-hub = { path = "../../../../crates/flottille-hub" }
flottille-link = { path = "../../../../crates/flottille-link" }
# Web Push's encryption (RFC 8291) and its VAPID signature (RFC 8292); TLS to a distributor's
# server. All three are in the repository's lock already, under the link's QUIC.
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
