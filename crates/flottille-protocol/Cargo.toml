[package]
name = "flottille-protocol"
description = "Flottille's socket protocol: its framing, its version and its methods"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Serde only: the mobile core and the link speak the protocol without the store or the daemon.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
