[package]
name = "flottille-hub"
description = "Flottille's hub: the user's member list, pair mode and presence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flottille-link = { version = "0.1.0", path = "../flottille-link" }
libc = "0.2.191"
# The pair code's QR, drawn in the console: already built for the window's kit.
qrcodegen = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
zeroize = "1.9.1"
