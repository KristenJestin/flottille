[package]
name = "flottille-hub"
description = "Flottille's hub: the user's member list, invitations and presence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flottille-link = { version = "0.1.0", path = "../flottille-link" }
# The operating system's random generator: the setup code and the invitations' tokens.
getrandom = "0.3.4"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already built under ed25519-dalek: the setup code and the tokens compared in constant time.
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
zeroize = "1.9.1"
