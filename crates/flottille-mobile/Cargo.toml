[package]
name = "flottille-mobile"
description = "Flottille's mobile core: the phone's keys, its join, its links, its signed requests and its view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A shared library the Android app loads (the generated Kotlin reaches it through JNA), and a Rust
# library its tests and the bindings' generator read.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The generator of the Kotlin bindings, run by the Gradle build on the host: never in the library.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
base64 = "0.22.1"
flottille-link = { version = "0.1.0", path = "../flottille-link" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# The boundary to Kotlin (`docs/remote.md`, "The Android app"): a dependency of weight, said in the
# pull request that brought it. Its default feature reads `cargo metadata`, which the generator
# needs and the library does not.
uniffi = { version = "0.32.2", default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
flottille-hub = { version = "0.1.0", path = "../flottille-hub" }
tempfile = "3.27.0"
