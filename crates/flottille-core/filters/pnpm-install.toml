# `pnpm install` and `add`: the progress and the bars of packages go; the warnings and the final
# lines stay.
name = "pnpm-install"
program = "pnpm"
args = ["install", "i", "add"]
drop = [
  '^Progress: resolved ',
  '^\s*\+{2,}-*\s*$',
  '^Lockfile is up to date',
  '^Already up[ -]to[ -]date',
]

[[tests]]
name = "the progress goes and the packages stay"
input = """
Lockfile is up to date, resolution step is skipped
Progress: resolved 1, reused 0, downloaded 0, added 0
Progress: resolved 14, reused 9, downloaded 5, added 14, done
Packages: +14
++++++++++++++
 WARN  deprecated glob@7.2.3: use a newer glob

dependencies:
+ left-pad 1.3.0

Done in 3.1s
"""
expected = """
Packages: +14
 WARN  deprecated glob@7.2.3: use a newer glob

dependencies:
+ left-pad 1.3.0

Done in 3.1s"""
removed = 4
