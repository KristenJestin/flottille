# `pytest`: the banner, the progress line of each file and the dots go; the failures, the short
# summary and the final line stay.
name = "pytest"
program = "pytest"
drop = [
  '^=+ test session starts =+$',
  '^platform ',
  '^rootdir: ',
  '^configfile: ',
  '^plugins: ',
  '^cachedir: ',
  '^collected \d+ items?\s*$',
  '^\S+\.py\s+[.sx]+\s*(\[\s*\d+%\])?$',
]

[[tests]]
name = "a run with one failure keeps the failure and the summary"
input = """
============================= test session starts ==============================
platform linux -- Python 3.12.3, pytest-8.3.2, pluggy-1.5.0
rootdir: /work/app
configfile: pyproject.toml
plugins: cov-5.0.0
collected 6 items

tests/test_parse.py ...                                                  [ 50%]
tests/test_total.py .F.                                                  [100%]

=================================== FAILURES ===================================
______________________________ test_adds_two_numbers ___________________________

    def test_adds_two_numbers():
>       assert add(2, 2) == 5
E       assert 4 == 5
E        +  where 4 = add(2, 2)

tests/test_total.py:9: AssertionError
=========================== short test summary info ============================
FAILED tests/test_total.py::test_adds_two_numbers - assert 4 == 5
========================= 1 failed, 5 passed in 0.12s ==========================
"""
expected = """

tests/test_total.py .F.                                                  [100%]

=================================== FAILURES ===================================
______________________________ test_adds_two_numbers ___________________________

    def test_adds_two_numbers():
>       assert add(2, 2) == 5
E       assert 4 == 5
E        +  where 4 = add(2, 2)

tests/test_total.py:9: AssertionError
=========================== short test summary info ============================
FAILED tests/test_total.py::test_adds_two_numbers - assert 4 == 5
========================= 1 failed, 5 passed in 0.12s =========================="""
removed = 7

[[tests]]
name = "a green run keeps its last line"
input = """
============================= test session starts ==============================
platform linux -- Python 3.12.3, pytest-8.3.2, pluggy-1.5.0
rootdir: /work/app
collected 3 items

tests/test_parse.py ...                                                  [100%]

============================== 3 passed in 0.03s ===============================
"""
expected = """


============================== 3 passed in 0.03s ==============================="""
removed = 5
