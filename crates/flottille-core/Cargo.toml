[package]
name = "flottille-core"
description = "Flottille's domain and store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2.191"
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
