[package]
name = "flottille-core"
description = "Flottille's domain and store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Already built for the window (and GPUI): PNG and JPEG, to scale a picture down before it is kept;
# GIF and WebP, to read the size of a picture and make its thumbnail.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.191"
# Already built for the window (GPUI): the project's branch format is a regular expression.
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
toml = { version = "1.1.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
