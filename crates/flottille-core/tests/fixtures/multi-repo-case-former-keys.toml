# multi-repo-case.toml as the release before #127 wrote it: the catalogue under `commands`, the
# procedures, the references and the recipe under their former names. The daemon brings it to the
# new keys at start, comments kept.
#
# The shape of docs/reference/multi-repo-case.md, with invented names: one folder that is a
# repository itself and holds six others, two of them on `develop`, libraries used by their
# consumers, and a test harness that compiles against none of them.
folder = "/work/app"
workspaces_root = "/work/app-work"
default_repositories = "all"
max_children = 3
never = [["git", "push"], ["git", "reset", "--hard"], ["git", "stash"], ["npm", "publish"]]

[[repositories]]
path = "."

[[repositories]]
path = "app-web"
base = ["develop", "main"]
depends_on = ["lib-app", "lib-core"]

[[repositories]]
path = "app-api"
base = ["develop", "main"]
depends_on = ["lib-api", "lib-core"]

[[repositories]]
path = "lib-core"

[[repositories]]
path = "lib-app"
depends_on = ["lib-core"]

[[repositories]]
path = "lib-api"
depends_on = ["lib-core"]

[[repositories]]
path = "e2e-tests"

[variables]
PACKAGE_STORE = "{workspace.path}/.store"
COMPOSE_PROJECT_NAME = "app-{workspace}"
E2E_WEB_DIR = "{workspace.path}/app-web"
E2E_API_DIR = "{workspace.path}/app-api"
PATH = "{workspace.path}/.bin"

[commands."api:dev"]
line = "npm run start:dev"
repository = "app-api"
serve = true

[commands."front:dev"]
line = "npm run start"
repository = "app-web"
serve = true

[commands.test]
line = "npm test"
repository = "app-api"
check = true
read_only = true

[commands.lint]
line = "npm run lint"
repository = "app-web"
check = true
read_only = true

[commands.generate-data]
line = "npm run generate-data"
repository = "app-api"
ask_before_running = true
added_by = "approval"

# What we do before every review.
[procedures.open-prs]
description = "Open the pull requests of the workspace"
instructions = "Push the branch, then open one pull request per repository with commits."

[procedures.open-prs.grants]
push = "allow"

[references.style] # the team's own words
description = "The code style"
path = "docs/STYLE.md"

[agent_actions]
procedures = "allow"

# Ignored files of each repository, from the main checkout, never over a file already there.
[[recipe]]
copy = [".env", ".env.*"]
for_each_repository = true

# The shared instructions and agent settings of the root folder, never `.git` nor `.gitignore`.
[[recipe]]
root_entries = true

# Libraries before their consumers.
[[recipe]]
run = "npm install"
for_each_repository = true

# The test data, once.
[[recipe]]
command = "generate-data"
