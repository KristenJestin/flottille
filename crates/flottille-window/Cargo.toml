[package]
name = "flottille-window"
description = "Flottille's window: a client of the daemon's socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Prints the frames drawn each second on the standard error, to measure the window at rest: a
# development build only (`--features frames`), never the shipped one.
frames = ["gpui-kit/profiler"]
# What only the window's scenarios may reach: the waits of the link a test shortens for the window
# it opens. Switched on by the dev-dependency of `flottille`, never by a shipped build.
test-support = []

[dependencies]
base64 = "0.22.1"
flottille-client = { version = "0.1.0", path = "../flottille-client" }
flottille-core = { version = "0.1.0", path = "../flottille-core" }
flottille-protocol = { version = "0.1.0", path = "../flottille-protocol" }
# The components, tokens and motion of the window, shared with other GPUI applications; on GPUI
# Fast, with Omarchy as a desktop theme source (its default `omarchy` feature).
gpui-design-system = { git = "https://github.com/KristenJestin/gpui-design-system", tag = "v0.2.0-beta.18" }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
# Already built for GPUI, which takes the window icon as one of its images; only the PNG decoder.
image = { version = "0.25.10", default-features = false, features = ["png"] }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets"] }
libc = "0.2.191"
# Already built for GPUI's paths; only its `LineJoin` and `LineCap`, which the mark's strokes round.
lyon_tessellation = "1.0.23"
serde_json = "1.0.154"

[dev-dependencies]
# Already built for the derive macros; the scan of `presence` gaps reads the window's sources
# as a syntax tree (`tests/a_block_has_its_own_space.rs`).
syn = { version = "2", features = ["full", "visit"] }
