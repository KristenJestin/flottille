[package]
name = "flottille-link"
description = "Flottille's link between the user's devices: identity, keys and the transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The keys of the user's devices (`docs/remote.md`, "Identity and keys"): Ed25519, the transport
# candidate's own. Its default features zeroize a private key when it is dropped.
ed25519-dalek = "2.2.0"
flottille-protocol = { version = "0.1.0", path = "../flottille-protocol" }
# The operating system's random generator, which makes every private key.
getrandom = "0.3.4"
# The transport (`docs/remote.md`, "The transport"), named in `src/transport.rs` only: QUIC, its
# TLS on the machines' Ed25519 keys as raw public keys (RFC 7250). Both were in the lock already;
# no relay, no NAT traversal and no discovery come with them.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
libc = "0.2.191"
# The member list and the invitation, as the hub and the daemon will send them.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already built under ed25519-dalek: a public key's fingerprint.
sha2 = "0.10.9"
# The setup's proofs that each side holds the setup code (`src/control.rs`): HMAC-SHA256. It was in
# the lock already, under oo7.
hmac = "0.12.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
# TLS to an `https://` hub, and the hub's on a certificate given (`src/transport.rs`): the certificate
# checked against the system's roots. Both were in the lock already, under reqwest.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8.5"
zeroize = "1.9.1"
# The packets of links the control session carries through the hub (`src/control.rs`), in its JSON
# lines. Already built for the daemon and the window.
base64 = "0.22.1"

# The values of all machines, sealed end to end for each machine (`src/shared.rs`): X25519 on the
# machines' own keys and ChaCha20-Poly1305 with HKDF. Both were in the lock already, under
# ed25519-dalek and rustls.
curve25519-dalek = { version = "4.1.3", default-features = false }
ring = "0.17.14"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
