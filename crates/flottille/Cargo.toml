[package]
name = "flottille"
description = "Flottille's daemon and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-client-protocol = "3.5.0"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dom_smoothie = "0.19.0"
flottille-core = { version = "0.1.0", path = "../flottille-core" }
flottille-window = { version = "0.1.0", path = "../flottille-window" }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
pdf_oxide = { version = "0.3.78", default-features = false }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
# Already built for the window; its `openat2` and `*at` calls open the file tools' paths by descriptors.
rustix = { version = "1.1.5", features = ["fs"] }
rustls-native-certs = "0.8.5"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "signal", "time", "process", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
toml_edit = "0.25.17"
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
# The window's scenarios run on GPUI's test platform, in front of a real daemon.
flottille-ui = { version = "0.1.0", path = "../flottille-ui" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "test-support"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# Only to give reqwest, under rmcp's test client, the crypto provider it insists on even for http.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
