[package]
name = "flottille"
description = "Flottille's daemon and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-client-protocol = { version = "3.5.0", features = ["unstable_end_turn_token_usage"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dom_smoothie = "0.19.0"
flottille-core = { version = "0.1.0", path = "../flottille-core" }
flottille-window = { version = "0.1.0", path = "../flottille-window" }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Already in the tree (env_logger's): the zone a provider names its quota's reset in
# (`quota.rs`), from the system's time zone database.
jiff = "0.2.38"
libc = "0.2.191"
# The vault's keyring: the Secret Service. Already built for the window (GPUI Fast keeps its
# credentials with it), with the same features: nothing more is compiled.
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
# Already in the tree (GPUI Fast uses it for the window): parses the Markdown an agent writes, to turn it into Jira's ADF.
markdown = "1.0.0"
pdf_oxide = { version = "0.3.78", default-features = false }
# The client of the user's connections too: their servers over stdio and Streamable HTTP.
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# Already built under rmcp's test client: the HTTP client of a URL connection, its TLS the daemon's
# own (`web::tls`), no redirect followed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Already built for the window; its `openat2` and `*at` calls open the file tools' paths by descriptors.
rustix = { version = "1.1.5", features = ["fs"] }
rustls-native-certs = "0.8.5"
# The store's own, for the extensions' tables (`docs/extensions.md`, "Data").
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint"] }
# Firecracker's seccomp filter compiler, pure Rust over libc: the page reader's allowlist.
seccompiler = "0.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The CI's own files, read to list what can be run (`bitbucket-pipelines.yml`, GitHub's
# workflows): the maintained fork of serde_yaml.
serde_norway = "0.9.42"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "signal", "time", "process", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
toml_edit = "0.25.17"
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
# To make real pictures, and read the size of the one that was stored.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The window's scenarios run on GPUI's test platform, in front of a real daemon.
gpui-design-system = { git = "https://github.com/KristenJestin/gpui-design-system", tag = "v0.2.0-alpha.feat-785-model-choice-own.10" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "test-support"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# Only to give reqwest, under rmcp's test client, the crypto provider it insists on even for http.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# To take a store back to what an older version wrote (the scenarios of #519).
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint"] }
