[package]
name = "flottille"
description = "Flottille's daemon and command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flottille-core = { version = "0.1.0", path = "../flottille-core" }
libc = "0.2.191"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "signal", "time", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
